
services:
  mysql:
      image: mysql:8.0
      container_name: kenjix_estoque_mysql
      restart: always
      ports:
        - "3306:3306"
      environment:
        MYSQL_ROOT_PASSWORD: root
        MYSQL_DATABASE: estoque
      volumes:
        - mysql_data:/var/lib/mysql
      command: --default-authentication-plugin=mysql_native_password
      networks:
        - kenjix_net
      healthcheck:
        test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
        interval: 5s
        timeout: 5s
        retries: 10

  flyway:
    image: flyway/flyway
    command: -connectRetries=60 migrate
    container_name: kenjix_flyway
    volumes:
      - ../db/migration:/flyway/sql
    environment:
      FLYWAY_URL: jdbc:mysql://mysql:3306/estoque
      FLYWAY_USER: root
      FLYWAY_PASSWORD: root
    depends_on:
      - mysql
    restart: on-failure
    networks:
      - kenjix_net

networks:
  kenjix_net:
    driver: bridge
volumes:
  mysql_data: